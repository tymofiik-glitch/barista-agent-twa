    chips.push(`<span class="pd-chip">${p.price} ${t('uah')}</span>`);

    const currentPhoto = getActivePhoto();
    scroll.innerHTML = `
      <div class="pd-photo">
        ${imgHtml(currentPhoto ? currentPhoto.replace('w=600', 'w=900') : currentPhoto, p.emoji, p.name[LANG])}
        <button class="pd-close-btn" onclick="closeProductSheet()">×</button>
      </div>
      <div class="pd-body">
        <div class="pd-meta-row">${chips.join('')}</div>
        <h2 class="pd-title">${p.name[LANG]}</h2>
        ${p.desc[LANG] ? `<div class="pd-desc">${p.desc[LANG]}</div>` : ''}
        <div id="pdModsContainer"></div>
      </div>
    `;
  }

  // Always update only mods (no photo touch)
  let modsHtml = '';
  if (p.modGroups && p.modGroups.length > 0) {
    p.modGroups.forEach((g, gi) => {
      const reqLabel = g.required ? ` <span style="color:var(--brand);font-size:11px;">(${LANG === 'uk' ? 'обов\'язково' : 'required'})</span>` : '';
      modsHtml += `<div class="pd-mod-group">
        <div class="pd-mod-group-title">${g.name[LANG]}${reqLabel}</div>`;
      for (const opt of g.options) {
        const sel = !!(activeMods[gi] && activeMods[gi][opt.id]);
        const optStopped = opt.posterId && STOP_LIST.has(Number(opt.posterId));
        const priceLabel = optStopped ? `<span style="color:#E8472A;font-weight:700;">немає 😔</span>` : (opt.price > 0 ? `+${opt.price} ${t('uah')}` : '');
        const clickAttr = optStopped ? '' : `onclick="toggleMod(${gi}, '${opt.id}', '${g.type}')"`;
        const stoppedStyle = optStopped ? 'opacity:0.5;pointer-events:none;' : '';
        modsHtml += `<div class="pd-mod-row${sel ? ' selected' : ''}" ${clickAttr} style="${stoppedStyle}">
          <div class="pd-mod-left">
            <div class="pd-mod-radio"></div>
            <span class="pd-mod-name">${opt.name[LANG]}</span>
          </div>
          <span class="pd-mod-price">${priceLabel}</span>
        </div>`;
      }
      modsHtml += `</div>`;
    });
  }
  const modsEl = document.getElementById('pdModsContainer');
  if (modsEl) modsEl.innerHTML = modsHtml;

  const blocked = isAddBlocked();
  const totalPrice = computeUnitPrice() * activeQty;
  document.getElementById('productSheetBottom').innerHTML = `
    <div class="pd-qty">
      <button onclick="changeQty(-1)" aria-label="minus">−</button>
      <span id="pdQtyVal">${activeQty}</span>
      <button onclick="changeQty(1)" aria-label="plus">+</button>
    </div>
    <button class="pd-add-btn" onclick="confirmAddToCart()" ${blocked ? 'disabled style="opacity:0.45;pointer-events:none;"' : ''}>
      <span>${t('add_to_cart')}</span>
      <span class="price">${totalPrice} ${t('uah')}</span>
    </button>
  `;
}

function computeUnitPrice() {
  const p = activeProduct;
  if (!p) return 0;
  let price = p.price;
  if (p.modGroups) {
    p.modGroups.forEach((g, gi) => {
      if (!activeMods[gi]) return;
      for (const opt of g.options) {
        if (activeMods[gi][opt.id]) price += opt.price;
      }
    });
  }
  return price;
}

function toggleMod(gi, optId, type) {
  if (!activeMods[gi]) activeMods[gi] = {};
  if (type === 'single') {
    activeMods[gi] = { [optId]: !activeMods[gi][optId] };
  } else {
    activeMods[gi][optId] = !activeMods[gi][optId];
  }
  hapticSelect();
  // update photo only when mod has photoOverride (e.g. Pepsi Zero)
  const g = activeProduct && activeProduct.modGroups && activeProduct.modGroups[gi];
  const hasPhotoOverride = g && g.options.some(o => o.photoOverride);
  renderProductSheet(hasPhotoOverride);
}

function changeQty(delta) {
  activeQty = Math.max(1, Math.min(99, activeQty + delta));
  document.getElementById('pdQtyVal').textContent = activeQty;
  const totalPrice = computeUnitPrice() * activeQty;
  const priceEl = document.querySelector('.pd-add-btn .price');
  if (priceEl) priceEl.textContent = `${totalPrice} ${t('uah')}`;
  hapticImpact('medium');
}

function closeProductSheet() {
  document.getElementById('productSheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  activeProduct = null;
}

function confirmAddToCart() {
  const p = activeProduct;
  if (!p) return;
  if (isAddBlocked()) return;
  const selectedMods = [];
  const commentParts = [];
  let modPrice = 0;
  if (p.modGroups) {
    p.modGroups.forEach((g, gi) => {
      if (!activeMods[gi]) return;
      for (const opt of g.options) {
        if (activeMods[gi][opt.id]) {
          if (g.asComment) {
            commentParts.push(opt.name['uk']);
          } else {
            selectedMods.push({ groupIndex: gi, optionId: opt.id, name: opt.name, price: opt.price, posterId: opt.posterId || 0, modificationId: opt.modificationId || 0 });
          }
          modPrice += opt.price;
        }
      }
    });
  }
  const itemComment = commentParts.join(', ');
  const itemPhoto = getActivePhoto();
  cart.push({
    uid: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    productId: p.id, posterId: p.posterId, name: p.name, photo: itemPhoto, emoji: p.emoji,
    qty: activeQty, mods: selectedMods, comment: itemComment, price: p.price + modPrice,
  });
  hapticImpact('medium');
  closeProductSheet();
  renderRecom();
  renderMenu(document.getElementById('searchInput').value);
  updateCartBar(true);
}

// ═══════════════════════════════════════════════════════════════════════
// CART
// ═══════════════════════════════════════════════════════════════════════
function cartTotal() { return cart.reduce((s, c) => s + c.price * c.qty, 0); }
function cartCount() { return cart.reduce((s, c) => s + c.qty, 0); }

function updateCartBar(animate) {
  const cnt = cartCount();
  const bar = document.getElementById('cartBar');
  if (bar) {
    if (cnt > 0) {
      bar.classList.add('visible');
      document.getElementById('cartBadge').textContent = cnt;
      document.getElementById('cartTotalText').textContent = `${cartTotal()} ${t('uah')}`;
      
      const avs = [...new Set(cart.map(c => c.photo))].slice(0, 3);
      document.getElementById('cartAvatars').innerHTML = avs.map(src => `<img src="${src}" class="cart-avatar" />`).join('');
      document.getElementById('cartBarLabel').textContent = t('your_order');
    } else {
      bar.classList.remove('visible');
    }
    if (animate) {
      bar.classList.remove('pulse');
      void bar.offsetWidth;
      bar.classList.add('pulse');
    }
  }
}

function changeCartQty(uid, delta) {
  const item = cart.find(c => c.uid === uid);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty < 1) {
    removeFromCart(uid);
    return;
  }
  item.qty = newQty;
  hapticImpact('medium');
  renderCartSheet();
  renderRecom();
  renderMenu(document.getElementById('searchInput').value);
  updateCartBar();
}

function removeFromCart(uid) {
  cart = cart.filter(c => c.uid !== uid);
  hapticImpact('medium');
  renderCartSheet();
  renderRecom();
  renderMenu(document.getElementById('searchInput').value);
  updateCartBar();
  if (cart.length === 0) closeCart();
}

function openCart() {
  if (cart.length === 0) return;
  renderCartSheet();
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('cartSheet').classList.add('open');
  hapticImpact('light');
}

function closeCart() {
  document.getElementById('cartSheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function closeAllSheets() {
  closeCart();
  closeProductSheet();
}

function renderCartSheet() {
  document.getElementById('cartTitle').textContent = t('cart');
  const items = document.getElementById('cartItems');
  const extras = document.getElementById('cartExtras');
  const summary = document.getElementById('cartSummary');
  const checkoutBtn = document.getElementById('checkoutBtn');

  if (cart.length === 0) {
    items.innerHTML = `<div class="empty-cart">
      <div class="empty-cart-icon">🛍</div>
      <div class="empty-cart-title">${t('cart_empty')}</div>
      <div style="font-size:13px">${t('cart_empty_hint')}</div>
    </div>`;
    extras.innerHTML = '';
    summary.innerHTML = '';
    checkoutBtn.style.display = 'none';
    return;
  }

  let html = '';
  for (const c of cart) {
    const modsHtml = c.mods.map(m => `<span class="cart-mod-tag">+ ${m.name[LANG]}</span>`).join('');
    const displayName = c.comment ? `${c.name[LANG]} — ${c.comment}` : c.name[LANG];
    html += `<div class="cart-item">
      <div class="cart-item-img">${imgHtml(c.photo || POOL.lunch, c.emoji || '🍽️', displayName)}</div>
      <div class="cart-item-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
          <div class="cart-item-name">${displayName}</div>
          <button class="cart-item-remove-btn" onclick="removeFromCart('${c.uid}')" aria-label="remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
        ${modsHtml ? `<div class="cart-item-mods">${modsHtml}</div>` : ''}
        <div class="cart-item-bottom">
          <div class="cart-qty-mini">
            <button onclick="changeCartQty('${c.uid}', -1)">−</button>
            <span>${c.qty}</span>
            <button onclick="changeCartQty('${c.uid}', 1)">+</button>
          </div>
          <span class="cart-item-price">${c.price * c.qty} ${t('uah')}</span>
        </div>
      </div>
    </div>`;
  }
  items.innerHTML = html;

  // Add Comment box & arrival pills
  const options = ['По готовності', '10 хв', '15 хв', '20 хв', '30 хв'];
  let pillsHtml = options.map(opt => `<button class="arrival-pill ${arrival_time === opt ? 'active' : ''}" onclick="setArrivalTime('${opt}')">${opt}</button>`).join('');

  const isCustomTime = arrival_time.includes(':');
  // Build time slots 08:00–21:30 in 30-min steps
  const timeSlots = [];
  for (let h = 8; h <= 21; h++) {
    timeSlots.push(`${String(h).padStart(2,'0')}:00`);
    if (h < 21) timeSlots.push(`${String(h).padStart(2,'0')}:30`);
  }
  const timeOptions = timeSlots.map(s => `<option value="${s}" ${arrival_time === s ? 'selected' : ''}>${s}</option>`).join('');
  let customPillHtml = `
    <div class="arrival-pill ${isCustomTime ? 'active' : ''}" style="position:relative; padding-right: 4px;">
      <select id="customTimeSelect" onchange="setCustomTime(this.value)" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;">
        <option value="">На час ▾</option>
        ${timeOptions}
      </select>
      <span style="pointer-events:none;">${isCustomTime ? arrival_time : 'На час ▾'}</span>
    </div>
  `;

  extras.innerHTML = `
    <div class="cart-extras-box">
      <div class="cart-extras-label"><span>${t('when_ready')}</span></div>
      <div class="arrival-pills">${pillsHtml}${customPillHtml}</div>
      <div class="cart-extras-label"><span>Коментар</span></div>
      <input type="text" class="comment-input" id="cartComment" placeholder="${t('comment_placeholder')}" oninput="updateComment(this.value)" value="${order_comment}">
    </div>
  `;

  summary.innerHTML = `<div class="cart-summary-card">
    <div class="cart-summary-row">
      <span>${t('subtotal')}</span>
      <span>${cartTotal()} ${t('uah')}</span>
    </div>
    <div class="cart-summary-row total">
      <span>${t('total')}</span>
      <span class="amount">${cartTotal()} ${t('uah')}</span>
    </div>
  </div>`;

  checkoutBtn.style.display = 'flex';
  checkoutBtn.innerHTML = `
    <span>${t('checkout')}</span>
    <span class="price-tag">${cartTotal()} ${t('uah')}</span>
  `;
}

function setArrivalTime(val) {
  arrival_time = val;
  hapticImpact('light');
  renderCartSheet();
}

function setCustomTime(val) {
  if (!val) return;
  arrival_time = val;
  hapticImpact('light');
  // Delay re-render to let the native time picker close and avoid UI flickering/disappearing
  setTimeout(() => {
    renderCartSheet();
  }, 100);
}

function makeCall(e) {
  if (e) {
    if (typeof e.preventDefault === 'function') e.preventDefault();
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
  }
  const phone = '+380669394333';
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
    window.Telegram.WebApp.openLink('tel:' + phone);
  } else {
    window.location.href = 'tel:' + phone;
  }
}

function updateComment(val) {
  order_comment = val;
}

// ═══════════════════════════════════════════════════════════════════════
// CHECKOUT
// ═══════════════════════════════════════════════════════════════════════
function checkout() {
  if (cart.length === 0) return;
  hapticImpact('heavy');

  // Activate stunning luxury loader before calling Telegram data
  const loader = document.getElementById('loaderOverlay');
  document.getElementById('loaderText').innerText = t('preparing_overlay');
  loader.classList.add('visible');

  setTimeout(() => {
    const orderData = {
      type: 'new_order',
      lang: LANG,
      arrival: arrival_time,
      comment: order_comment,
      items: cart.map(c => ({
        productId: c.productId, posterId: c.posterId, name: c.name, qty: c.qty,
        basePrice: c.price - c.mods.reduce((s, m) => s + m.price, 0),
        mods: c.mods.map(m => ({ optionId: m.optionId, posterId: m.posterId, modificationId: m.modificationId || 0, name: m.name, price: m.price })),
        lineTotal: c.price * c.qty,
      })),
      total: cartTotal(),
    };

    if (tg && tg.sendData) tg.sendData(JSON.stringify(orderData));
    else {
      loader.classList.remove('visible');
      alert('Telegram WebApp не доступний.\n\n' + JSON.stringify(orderData, null, 2));
    }
  }, 1500);
}

// ═══════════════════════════════════════════════════════════════════════
// LANG, NAV, SEARCH
// ═══════════════════════════════════════════════════════════════════════
function setLang(l) {
  LANG = l;
  document.getElementById('langUk').classList.toggle('active', l === 'uk');
  document.getElementById('langEn').classList.toggle('active', l === 'en');
  document.getElementById('searchInput').placeholder = t('search');
  document.getElementById('storiesTitle').textContent = t('stories_title');
  document.getElementById('storiesSub').textContent = t('stories_sub');
  document.getElementById('recomTitle').textContent = t('recom_title');
  document.getElementById('recomSub').textContent = t('recom_sub');
  renderStories();
  renderRecom();
  renderMenu(document.getElementById('searchInput').value);
  updateCartBar();
  if (activeProduct) renderProductSheet(true);
  updateServicesI18n();
  hapticImpact('light');
}

function scrollToCategory(catId) {
  const el = document.getElementById('cat_' + catId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActiveTab(catId);
  }
  hapticImpact('light');
}

function setActiveTab(catId) {
  document.querySelectorAll('.story').forEach(s => {
    s.classList.toggle('active', s.dataset.cat === catId);
  });
  activeCategory = catId;
}

function filterMenu() {
  renderMenu(document.getElementById('searchInput').value);
}

function setupScrollSpy() {
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        const catId = entry.target.id.replace('cat_', '');
        setActiveTab(catId);
        const activeStory = document.querySelector(`.story[data-cat="${catId}"]`);
        if (activeStory) activeStory.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }
  }, { rootMargin: '-100px 0px -60% 0px' });
  setTimeout(() => {
    document.querySelectorAll('.category-block').forEach(b => observer.observe(b));
  }, 150);
}

// haptics
function hapticImpact(style) {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
  }
}
function hapticSelect() {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch(e) {}
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ONBOARDING SPLASH
// ═══════════════════════════════════════════════════════════════════════
function initSplash() {
  // Час за Києвом (UTC+3) — незалежно від пристрою клієнта
  const kyivOffset = 3;
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const kyivTime = new Date(utc + kyivOffset * 3600000);
  const h = kyivTime.getHours();
  const min = kyivTime.getMinutes();

  // Кав'ярня: 08:00–18:00
  const OPEN_H = 8, CLOSE_H = 18;
  const isOpen = h >= OPEN_H && h < CLOSE_H;

  const dot = document.getElementById('splashStatusDot');
  const statusText = document.getElementById('splashStatusText');
  if (dot && statusText) {
    if (isOpen) {
      dot.classList.remove('closed');
      // Скільки лишилось до закриття
      const minsLeft = (CLOSE_H - h) * 60 - min;
      let label;
      if (minsLeft <= 60) {
        label = LANG === 'en' ? `Closing soon · ${CLOSE_H}:00` : `Скоро закриваємось · до ${CLOSE_H}:00`;
      } else {
        label = LANG === 'en' ? `Open · until ${CLOSE_H}:00` : `Відчинено · до ${CLOSE_H}:00`;
      }
      statusText.textContent = label;
    } else {
      dot.classList.add('closed');
      statusText.textContent = LANG === 'en'
        ? `Closed · opens at ${OPEN_H}:00`
        : `Зачинено · відкриваємось о ${OPEN_H}:00`;
    }
  }

  // Персональне привітання з імʼям з Telegram
  const greeting = document.getElementById('splashGreeting');
  if (greeting) {
    let name = '';
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      name = tg.initDataUnsafe.user.first_name || '';
    }
    if (name) {
      greeting.textContent = LANG === 'en' ? `Hi, ${name} ☕` : `Привіт, ${name} ☕`;
    } else {
      greeting.textContent = '';
    }
  }

  // Показуємо splash тільки раз за сесію
  const lastSeen = sessionStorage.getItem('tab_splash_seen');
  if (lastSeen) {
    document.getElementById('splash').style.display = 'none';
  }
}

function closeSplash() {
  hapticImpact('medium');
  const splash = document.getElementById('splash');
  splash.classList.add('out');
  sessionStorage.setItem('tab_splash_seen', '1');
  setTimeout(() => { splash.style.display = 'none'; }, 580);
}

function onPromoScroll() {
  const slider = document.getElementById('promoSlider');
  if (!slider) return;
  const slideWidth = slider.offsetWidth;
  const idx = Math.round(slider.scrollLeft / (slideWidth - 32 + 12));
  if (idx !== promoCurrentSlide) {
    promoCurrentSlide = idx;
    updatePromoDots();
  }
}

function updateServicesI18n() {}

// init
async function init() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const tgLang = tg.initDataUnsafe.user.language_code;
    if (tgLang && tgLang.startsWith('en')) LANG = 'en';
  }
  document.getElementById('langUk').classList.toggle('active', LANG === 'uk');
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
  document.getElementById('searchInput').placeholder = t('search');
  document.getElementById('storiesTitle').textContent = t('stories_title');
  document.getElementById('storiesSub').textContent = t('stories_sub');
  document.getElementById('recomTitle').textContent = t('recom_title');
  document.getElementById('recomSub').textContent = t('recom_sub');

  renderStories();
  renderRecom();
  renderMenu();
  updateCartBar();
  setupScrollSpy();
  if (CATEGORIES.length > 0) setActiveTab(CATEGORIES[0].id);
  initSplash();
  updateServicesI18n();

  // Fetch stop-list in background — won't block render
  fetchStopList().then(() => refreshStopListUI());
}

document.addEventListener('DOMContentLoaded', init);
